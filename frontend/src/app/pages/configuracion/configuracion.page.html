<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/camionetas')">
          <ion-card-header>
            <ion-icon name="car-sport" size="large" color="primary"></ion-icon>
            <ion-card-title>Camionetas</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar camionetas disponibles
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/checklist-items')">
          <ion-card-header>
            <ion-icon name="checkbox" size="large" color="secondary"></ion-icon>
            <ion-card-title>Items de Checklist</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar items del checklist de uso de camioneta
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/usuarios')">
          <ion-card-header>
            <ion-icon name="people" size="large" color="warning"></ion-icon>
            <ion-card-title>Usuarios</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar usuarios del sistema y permisos de acceso
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/auditoria')">
          <ion-card-header>
            <ion-icon name="shield-checkmark" size="large" color="tertiary"></ion-icon>
            <ion-card-title>Auditoría</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Ver historial de cambios en reservas y usos
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
