<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar Placa' : 'Nueva Placa' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardar()" [disabled]="loading">
        <ion-icon name="checkmark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="placaForm" (ngSubmit)="guardar()">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Datos de la Placa</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <!-- Número de Placa -->
        <ion-item>
          <ion-label position="stacked">Número de Placa *</ion-label>
          <ion-input
            formControlName="numero_placa"
            placeholder="Ej: ABC-123"
            maxlength="10"
            autocapitalize="characters"
          ></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="getErrorMessage('numero_placa')">
          {{ getErrorMessage('numero_placa') }}
        </ion-note>

        <!-- Tipo de Vehículo -->
        <ion-item>
          <ion-label position="stacked">Tipo de Vehículo</ion-label>
          <ion-select formControlName="tipo_vehiculo" placeholder="Seleccione un tipo">
            <ion-select-option *ngFor="let tipo of tiposVehiculo" [value]="tipo">
              {{ tipo }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Marca -->
        <ion-item>
          <ion-label position="stacked">Marca</ion-label>
          <ion-input
            formControlName="marca"
            placeholder="Ej: Toyota, Volvo, Mercedes"
            maxlength="50"
          ></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="getErrorMessage('marca')">
          {{ getErrorMessage('marca') }}
        </ion-note>

        <!-- Modelo -->
        <ion-item>
          <ion-label position="stacked">Modelo</ion-label>
          <ion-input
            formControlName="modelo"
            placeholder="Ej: Hilux, FH16, Actros"
            maxlength="50"
          ></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="getErrorMessage('modelo')">
          {{ getErrorMessage('modelo') }}
        </ion-note>

        <!-- Año -->
        <ion-item>
          <ion-label position="stacked">Año</ion-label>
          <ion-input
            formControlName="anio"
            type="number"
            placeholder="Ej: 2023"
            min="1900"
            max="2100"
          ></ion-input>
        </ion-item>

        <!-- Estado Activo -->
        <ion-item>
          <ion-label>Activo</ion-label>
          <ion-checkbox formControlName="activo" slot="end"></ion-checkbox>
        </ion-item>
      </ion-card-content>
    </ion-card>

    <!-- Botones de Acción -->
    <div class="button-container">
      <ion-button expand="block" color="medium" (click)="cancelar()" [disabled]="loading">
        Cancelar
      </ion-button>
      <ion-button expand="block" color="primary" type="submit" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">{{ isEditMode ? 'Actualizar' : 'Guardar' }}</span>
      </ion-button>
    </div>
  </form>
</ion-content>
