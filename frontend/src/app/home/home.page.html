<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Control de Camioneta
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Control de Camioneta</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6" *ngIf="permisos.puedeUsarCamioneta()">
        <ion-card button (click)="navegarA('/uso-camioneta')">
          <ion-card-header>
            <ion-icon name="car-sport" size="large" color="primary"></ion-icon>
            <ion-card-title>Uso de Camioneta</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Registrar uso de camioneta con checklist de condiciones
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6" *ngIf="permisos.puedeReservarCamioneta()">
        <ion-card button (click)="navegarA('/reserva-camioneta')">
          <ion-card-header>
            <ion-icon name="calendar" size="large" color="secondary"></ion-icon>
            <ion-card-title>Reserva de Camioneta</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Reservar horarios de camioneta por bloques de 30 minutos
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6" *ngIf="permisos.puedeAccederConfiguracion()">
        <ion-card button (click)="navegarA('/configuracion')">
          <ion-card-header>
            <ion-icon name="settings" size="large" color="tertiary"></ion-icon>
            <ion-card-title>Configuración</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar camionetas, checklist, usuarios y auditoría
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
