<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Control de Alquiler
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Control de Alquiler</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6" *ngIf="permisos.puedeCrearRegistro()">
        <ion-card button (click)="navegarA('/registro-form')">
          <ion-card-header>
            <ion-icon name="add-circle" size="large" color="primary"></ion-icon>
            <ion-card-title>Nuevo Registro</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Crear un nuevo registro de alquiler de jabas y parihuelas
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6" *ngIf="permisos.puedeVerRegistros()">
        <ion-card button (click)="navegarA('/registro-lista')">
          <ion-card-header>
            <ion-icon name="list" size="large" color="secondary"></ion-icon>
            <ion-card-title>Lista de Registros</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Ver, filtrar y gestionar todos los registros
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/dashboard')">
          <ion-card-header>
            <ion-icon name="stats-chart" size="large" color="success"></ion-icon>
            <ion-card-title>Dashboard</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Ver estadísticas y gráficos del sistema
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6" *ngIf="permisos.puedeAccederConfiguracion()">
        <ion-card button (click)="navegarA('/configuracion')">
          <ion-card-header>
            <ion-icon name="settings" size="large" color="tertiary"></ion-icon>
            <ion-card-title>Configuración</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar clientes, choferes, placas y jabas
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
